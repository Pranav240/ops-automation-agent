name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/aws
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false
      - run: terraform -chdir=infra/aws/bootstrap validate

  # Builds the images and deploys the chart to a throwaway kind cluster. There is no AWS here, so
  # the workers and KEDA stay off; the setup job still proves the worker image runs.
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ops-agent
      - run: helm lint deploy/helm/ops-agent -f deploy/helm/ci-values.yaml
      - run: docker build -f docker/mock-api.Dockerfile -t ops-agent-mock-api:local .
      - run: docker build -f docker/worker.Dockerfile -t ops-agent-worker:local --build-arg GIT_COMMIT=${GITHUB_SHA::7} .
      - run: kind load docker-image ops-agent-mock-api:local ops-agent-worker:local --name ops-agent
      - run: helm install ops-agent deploy/helm/ops-agent -f deploy/helm/ci-values.yaml --wait --timeout 8m
      - run: kubectl wait --for=condition=complete job/ops-agent-setup --timeout=60s
      - run: kubectl rollout status deploy/ops-agent-mock-api --timeout=60s
      - if: failure()
        run: kubectl get pods -A; kubectl describe job ops-agent-setup; kubectl logs job/ops-agent-setup --all-containers

  # Runs the agent with real Haiku calls on a small dev subset (~$0.05). Pull requests only.
  eval-gate:
    if: github.event_name == 'pull_request'
    needs: lint-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ops
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ops -d ops" --health-interval 5s --health-retries 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: ops
      POSTGRES_PORT: "5433"
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Check secret
        run: test -n "$ANTHROPIC_API_KEY" || (echo "Add ANTHROPIC_API_KEY as a repository secret" && exit 1)
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('agent/config.py') }}
      - run: uv sync --locked --extra dev
      - run: uv run python -m retrieval.ingest
      - run: uv run python -m evals.ci_gate
      - run: RUN_LIVE=1 uv run pytest -q -m live
