[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-automation-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12",
    "langfuse>=4.17",
    "python-dotenv>=1.0",
    "fastapi>=0.148",
    "uvicorn>=0.54",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.7",
    "pgvector>=0.5.1",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "qdrant-client>=1.20.0",
    "sqlglot>=30.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "mock_api*", "evals*", "retrieval*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real LLM; runs only with RUN_LIVE=1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
