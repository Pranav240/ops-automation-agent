apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-mock-api
spec:
  replicas: 1 # state is in memory, so one replica only
  selector:
    matchLabels:
      app: ops-agent-mock-api
  template:
    metadata:
      labels:
        app: ops-agent-mock-api
    spec:
      containers:
        - name: mock-api
          image: {{ .Values.images.mockApi }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ops-agent-mock-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mockApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ops-agent-mock-api
spec:
  selector:
    app: ops-agent-mock-api
  ports:
    - port: 8000
