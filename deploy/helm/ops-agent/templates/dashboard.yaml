{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-agent-dashboard
  template:
    metadata:
      labels:
        app: ops-agent-dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.images.dashboard }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: ops-agent-config
            - secretRef:
                name: ops-agent-dashboard-secrets
          env:
            - name: POSTGRES_USER
              value: ops_dashboard
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
# No public address. Reach it with: kubectl port-forward deploy/ops-agent-dashboard 8090:8090
apiVersion: v1
kind: Service
metadata:
  name: ops-agent-dashboard
spec:
  selector:
    app: ops-agent-dashboard
  ports:
    - port: 8090
{{- end }}
