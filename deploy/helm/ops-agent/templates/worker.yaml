{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-worker
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: ops-agent-worker
  template:
    metadata:
      labels:
        app: ops-agent-worker
    spec:
      serviceAccountName: ops-agent-worker
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          envFrom:
            - configMapRef:
                name: ops-agent-config
            - secretRef:
                name: ops-agent-worker-secrets
          env:
            - name: POSTGRES_USER
              value: ops_worker
          # The worker has no port. It touches this file on every poll.
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/ops-worker-heartbeat"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ops-worker-heartbeat"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/ops-worker-heartbeat) )) -lt 300
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
